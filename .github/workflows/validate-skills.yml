name: Validate Skills

on:
  push:
    branches: [main]
    paths:
      - 'curated/**'
      - 'community/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/validate-skills.yml'
  pull_request:
    paths:
      - 'curated/**'
      - 'community/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/validate-skills.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r scripts/requirements.txt
      - name: Regression tests
        run: python -m unittest discover -s tests -v
      - name: 校验所有技能格式
        run: bash scripts/validate-skill.sh
      - name: 校验精选技能单向部署
        run: |
          skills_root="$(mktemp -d)"
          scripts/deploy-curated-skill.sh install obsidian "$skills_root"
          scripts/deploy-curated-skill.sh check obsidian "$skills_root"
          printf '\n# drift\n' >> "$skills_root/obsidian/SKILL.md"
          ! scripts/deploy-curated-skill.sh check obsidian "$skills_root"
