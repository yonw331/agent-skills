name: Publish Registry

on:
  push:
    branches:
      - main
    paths:
      - 'curated/**'
      - 'community/**'
      - 'scripts/**'
      - '.github/workflows/publish-registry.yml'

permissions:
  contents: write

jobs:
  build-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r scripts/requirements.txt
      - name: Validate before publishing
        run: bash scripts/validate-skill.sh
      - name: 构建 registry.json
        run: bash scripts/build-registry.sh
      - name: 提交更新
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git
          git add registry.json SKILLS.md
          git diff --cached --quiet || git commit -m "chore: auto-update registry [skip ci]"
          git push
